[package]
name = "maximus-app"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "maximus"

[[bin]]
name = "maximus"
path = "src/main.rs"

[lib]
name = "maximus_app"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
maximus-core.workspace = true
maximus-math.workspace = true
maximus-render.workspace = true
maximus-help.workspace = true
maximus-plot.workspace = true
serde.workspace = true
serde_json.workspace = true
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui_plot = "0.38"
egui_extras = { version = "0.37", default-features = false, features = ["image", "file"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
maximus-mcp.workspace = true
maximus-backend-native.workspace = true
dirs = "6"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement", "Element", "console"] }
