[package]
name = "maximus-app"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "maximus"

[[bin]]
name = "maximus"
path = "src/main.rs"

[lib]
name = "maximus_app"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
maximus-core.workspace = true
maximus-math.workspace = true
maximus-render.workspace = true
maximus-help.workspace = true
maximus-plot.workspace = true
serde.workspace = true
serde_json.workspace = true
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "clipboard", "links"] }
egui_plot = "0.38"
egui_extras = { version = "0.37", default-features = false, features = ["image", "file", "svg"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
maximus-mcp.workspace = true
maximus-backend-native.workspace = true
dirs = "6"
rfd = "0.17"

[target.'cfg(target_arch = "wasm32")'.dependencies]
maximus-backend-web = { path = "../maximus-backend-web" }
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement", "Element", "console", "Response"] }

[package.metadata.deb]
name = "maximus"
maintainer = "Jake Harrison"
section = "science"
priority = "optional"
extended-description = "Notebook frontend for the Maxima computer algebra system with textbook input and output, integrated help and plotting."
depends = "$auto, maxima"
recommends = "gnuplot, maxima-doc"
assets = [
  ["../../target/release/maximus", "usr/bin/", "755"],
  ["../../packaging/maximus.desktop", "usr/share/applications/io.github.jakeharrison11.Maximus.desktop", "644"],
  ["../../packaging/io.github.jakeharrison11.Maximus.metainfo.xml", "usr/share/metainfo/", "644"],
  ["assets/maximus.png", "usr/share/icons/hicolor/512x512/apps/io.github.jakeharrison11.Maximus.png", "644"],
]
